name: Mirror SAP DMC APIs

on:
  schedule:
    - cron: "17 5 * * *"   # daily at 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write   # needed to trigger the Pages deploy workflow

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check public catalog
        id: mirror-check
        run: |
          set +e
          python mirror.py --check
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 3 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            exit "$status"
          fi

      - name: Restore mirror dependency cache
        if: steps.mirror-check.outputs.changed == 'true'
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install mirror dependencies
        if: steps.mirror-check.outputs.changed == 'true'
        run: |
          mkdir -p "$(pip cache dir)"
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Mirror changed specs
        id: mirror
        if: steps.mirror-check.outputs.changed == 'true'
        env:
          SAP_USER: ${{ secrets.SAP_USER }}
          SAP_PASS: ${{ secrets.SAP_PASS }}
          SAP_ACCOUNT: ${{ secrets.SAP_ACCOUNT }}
        run: python mirror.py --min-specs 80

      # mirror.py blanks out the form fields before capturing this, so the
      # artifact cannot publish the SAP account on a public repository.
      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: login-failure
          path: login_failure.png
          if-no-files-found: ignore

      # mirror.py reports the history file it wrote. Rediscovering it with
      # `git diff HEAD` did not work: the file is untracked until the commit
      # step below, so the diff never listed it and no issue was ever opened.
      - name: Prepare API change notification
        id: api-change
        if: steps.mirror.outputs.history_file != ''
        env:
          HISTORY_FILE: ${{ steps.mirror.outputs.history_file }}
        run: |
          if [ ! -f "$HISTORY_FILE" ]; then
            echo "::error::mirror.py reported $HISTORY_FILE but it does not exist"
            exit 1
          fi

          echo "detected=true" >> "$GITHUB_OUTPUT"
          python issue_notification.py "$HISTORY_FILE" \
            --repository "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            --body-file "$RUNNER_TEMP/api-change-issue.md" \
            --github-output "$GITHUB_OUTPUT"

      - name: Create API change issue
        if: steps.api-change.outputs.detected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: ${{ steps.api-change.outputs.title }}
          REPORT_ID: ${{ steps.api-change.outputs.report_id }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          existing_issue="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state all \
              --search "$REPORT_ID in:title" \
              --limit 1 \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [ -n "$existing_issue" ]; then
            echo "Issue #$existing_issue already reports this API change"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$ISSUE_TITLE" \
              --body-file "$RUNNER_TEMP/api-change-issue.md" \
              --assignee "$REPOSITORY_OWNER"
          fi

      - name: Flag APIs that could not be mirrored
        if: steps.mirror.outputs.failed_apis != ''
        env:
          FAILED_APIS: ${{ steps.mirror.outputs.failed_apis }}
        run: |
          echo "::warning::Kept previous specs for these APIs - $FAILED_APIS"

      - name: Commit and push changes
        id: commit
        if: steps.mirror-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A output README.md
          if git diff --cached --quiet; then
            echo "No spec changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update specs $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN don't fire `on: push` workflows,
      # so kick the Pages deploy explicitly.
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
